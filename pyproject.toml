[project]
name = "bumblewick-support-mcp"
version = "0.1.0"
description = "An MCP server for the Bumblewick & Co. candle-shop support desk — the example project for the 'Give the Robot Hands' series."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "pydantic>=2.6",
    "pydantic-settings>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
bumblewick-support-mcp = "bumblewick_support.server:main"

[project.urls]
Repository = "https://github.com/Saveanu-Robert/bumblewick-support-mcp"
Issues = "https://github.com/Saveanu-Robert/bumblewick-support-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bumblewick_support"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
